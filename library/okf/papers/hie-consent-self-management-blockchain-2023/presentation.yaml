    "solution": "The proposed solution is a blockchain-based Consent Self-Management DApp. Patients authenticate through a wallet, view providers with consent, add or revoke provider consent, and submit consent transactions through a smart contract to a permissioned Ethereum network whose HIE nodes share the consent status. The design augments existing provider consent forms while enabling patient-originated consent changes across HIEs.",
