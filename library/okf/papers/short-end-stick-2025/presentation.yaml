    "solution": "The solution is a blockchain-based shared information system in which sensor data remain in a provider-exclusive private data collection, a hash/proof of integrity is made available to the recipient, a smart contract computes a nonreversible stress factor from the private data, and Hyperledger Fabric governance policies require joint approval for changes to computation and access mechanisms.",
    "output_knowledge": "The paper produces reusable design knowledge for shared information systems: sensitive data should remain with the information provider while integrity is proven to the recipient; shared information should be computed through nonreversible, reliable, independently executed functions; and changes to computation mechanisms should require joint approval. It also shows empirically that addressing poaching and manipulation together increases data sharing and reliance."
