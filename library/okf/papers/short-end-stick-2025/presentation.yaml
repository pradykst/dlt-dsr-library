    "research_problem": "Interorganizational information sharing based on sensitive data is blocked by two-sided opportunism: information providers fear information poaching if recipients access sensitive data, while information recipients fear information manipulation if providers keep the data hidden. Existing organizational and technical safeguards either cannot reliably prevent opportunism or address only one side at a time.",
