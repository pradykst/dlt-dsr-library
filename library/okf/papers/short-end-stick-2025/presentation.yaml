    "research_process": "The paper follows DSRM: it identifies the two-sided opportunism problem from literature, derives two design requirements and three design principles, instantiates them in a machine-tool leasing research consortium, implements a Hyperledger Fabric prototype, demonstrates efficacy through 22 expert interviews, and evaluates utility through vignette-based surveys of 85 machine tool users and 77 lessors.",
