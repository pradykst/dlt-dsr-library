    "limitations": [
      "The design is most relevant for IoT sensor-data pipelines in multiparty ecosystems or settings with conflicting interests. It assumes raw sensor data should not be stored directly on a public blockchain, source-to-sink protection should occur as early as possible but may not be perfect with current sensors, cross-validation is use-case specific, privacy requires mechanisms on top of blockchain, and current scalability and cost constraints favor hybrid on-chain/off-chain architectures."
