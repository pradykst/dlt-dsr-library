    "research_process": "The paper follows design science research. It derives design requirements from IoT sensor-data protection challenges, derives design principles from justificatory theories, maps principles to design features, builds CertifiCar across three design cycles, evaluates the prototype through field tests, expert workshops and interviews, and then conducts an ex post evaluation across odometer fraud, pharmaceutical cold chains, and energy microgrids to formulate an SDPS design theory.",
