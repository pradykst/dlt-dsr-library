    "research_problem": "IoT sensor data generation, processing, and exchange create simultaneous integrity, privacy, scalability, and cost challenges. Sensor data may be manipulated across a multistage pipeline, may reveal sensitive personal or business information, may be produced at large volume, and may become too expensive to protect with naive blockchain storage. Existing SDPS work lacks generalizable design knowledge linking requirements, principles, features, and instantiation.",
    "research_objective": null,
    "methodology": null,
    "evaluation_method": [
      "Evaluation includes three iterative CertifiCar development cycles, field tests with 5 cars and later 100 cars, workshops, semistructured expert interviews, a 16-person focus group for the smartphone certificate interface, and an ex post evaluation with nine domain experts across odometer, cold-chain, and energy microgrid use cases. The results support source-to-sink protection, cross-validation, data-owner control, and hybrid scalable architecture, while identifying limitations and design implications."
    ],
