    "solution": "The proposed solution is a blockchain-based sensor data protection system that collects sensor and validation data, preprocesses data into blockchain transactions, stores encrypted raw data off-chain, stores hashes on-chain as independent verification evidence, controls data access through owner-managed access rights, certifies data by comparing raw-data hashes with blockchain hashes and performing consistency/cross-validation checks, and retrieves only selected certified data for recipients.",
    "output_knowledge": "The paper produces an SDPS design theory consisting of four design requirements, four design principles, nine design features, an instantiated CertifiCar prototype, design implications for blockchain-based SDPSs, and reusable knowledge that hybrid blockchain architectures can support tamper-resistant, privacy-preserving, scalable, and economically feasible IoT sensor-data certification."
