    "solution": "The proposed solution is an SSI-based eKYC framework in which customers hold KYC-related verifiable credentials in wallets, banks and issuers use DIDs and institutional agents, customers present selective verifiable presentations over bilateral encrypted channels, and a distributed ledger stores only public verification infrastructure such as issuer keys, credential schemas, DID documents, and privacy-preserving revocation registries. The framework covers completely new onboarding, fast onboarding, new-to-KYC onboarding, name screening, risk assessment, ongoing monitoring, and record keeping.",
